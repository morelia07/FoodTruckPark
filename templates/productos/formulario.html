{% extends 'base.html' %}

{% block title %}
{% if producto %}
Editar Producto
{% else %}
Nuevo Producto
{% endif %}
{% endblock %}


{% block content %}


<div class="card">

    <div class="card-header">

        <h3>

            {% if producto %}
                ✏️ Editar Producto
            {% else %}
                ➕ Nuevo Producto
            {% endif %}

        </h3>

    </div>


    <div class="card-body">


        <form method="POST">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label">
                    Food Truck
                </label>


                <select
                    name="foodtruck"
                    class="form-select"
                    required
                >

                    <option value="">
                        Seleccione un Food Truck
                    </option>


                    {% for foodtruck in foodtrucks %}

                    <option
                        value="{{ foodtruck.id }}"

                        {% if producto and producto.foodtruck.id == foodtruck.id %}
                            selected
                        {% endif %}
                    >

                        {{ foodtruck.nombre }}

                    </option>


                    {% endfor %}


                </select>


            </div>



            <div class="mb-3">

                <label class="form-label">
                    Nombre del producto
                </label>


                <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    value="{{ producto.nombre|default:'' }}"
                    required
                >


            </div>



            <div class="mb-3">

                <label class="form-label">
                    Precio
                </label>


                <input
                    type="number"
                    step="0.01"
                    name="precio"
                    class="form-control"
                    value="{{ producto.precio|default:'' }}"
                    required
                >


            </div>



            <div class="mb-3">

                <label class="form-label">
                    Stock
                </label>


                <input
                    type="number"
                    name="stock"
                    class="form-control"
                    value="{{ producto.stock|default:'' }}"
                    required
                >


            </div>



            <button type="submit" class="btn btn-success">

                💾 Guardar

            </button>


            <a
                href="{% url 'lista_productos' %}"
                class="btn btn-secondary"
            >

                Cancelar

            </a>


        </form>


    </div>


</div>


{% endblock %}
