{% extends 'base.html' %}

{% block title %}
Agregar Cajero
{% endblock %}

{% block content %}

<div class="row justify-content-center">

```
<div class="col-md-6">

    <div class="card shadow-sm">

        <div class="card-header bg-dark text-white">

            <h4 class="mb-0">
                👤 Agregar Cajero
            </h4>

        </div>


        <div class="card-body">

            <p class="text-muted">
                Crea una cuenta para un nuevo cajero.
            </p>


            <form method="POST" autocomplete="off">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Nombre de usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Ejemplo: cajero01"
                        autocomplete="off"
                        value=""
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Ingrese una contraseña"
                        autocomplete="new-password"
                        value=""
                        required
                    >

                </div>


                <div class="alert alert-info">

                    <strong>Rol:</strong> Cajero

                    <br>

                    Este usuario solamente podrá acceder
                    a las funciones permitidas para cajeros.

                </div>


                <div class="d-flex justify-content-between">

                    <a
                        href="{% url 'lista_cajeros' %}"
                        class="btn btn-secondary"
                    >

                        ← Cancelar

                    </a>


                    <button
                        type="submit"
                        class="btn btn-dark"
                    >

                        💾 Crear Cajero

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
