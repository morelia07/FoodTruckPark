
{% extends 'base.html' %}


{% block login %}

<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">

    <div class="col-md-5 col-lg-4">

        <div class="card shadow border-0">

            <div class="card-body p-4">


                <div class="text-center mb-4">

                    <div class="fs-1">
                        🍴
                    </div>

                    <h3 class="fw-bold">
                        Food Truck Park
                    </h3>

                    <p class="text-muted">
                        Inicia sesión para continuar
                    </p>

                </div>


                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-danger">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            Usuario
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Ingrese su usuario"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Ingrese su contraseña"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-dark w-100 py-2">

                        Ingresar

                    </button>


                </form>


            </div>

        </div>

    </div>

</div>

{% endblock %}
